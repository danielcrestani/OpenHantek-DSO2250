name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publishes the screenshots on the ci-shots branch

jobs:
  linux-qt6:
    # Same base as Pop!_OS 22.04: Qt 6.2, GCC 11, libusb 1.0.25
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the package version counts the commits

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools libqt6opengl6-dev libqt6serialport6-dev libfftw3-dev \
            binutils-dev libusb-1.0-0-dev desktop-file-utils mesa-common-dev libgl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev
          # the tests also run with a decimal-comma locale (Brazilian Portuguese)
          sudo locale-gen pt_BR.UTF-8 > /dev/null

      - name: Configurar
        run: cmake -S . -B build -DOPENHANTEK_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 2>&1 | tee build.log

      - name: Avisos do compilador
        if: always()
        run: |
          # each GCC warning/error becomes an annotation (visible in the run summary and through the API)
          grep -E "^/.+:[0-9]+:[0-9]+: (warning|error|fatal error):" build.log | sort -u > diag.txt || true
          echo "::notice title=Compilação::$(grep -c ': warning:' diag.txt || true) avisos, $(grep -c -E ': (fatal )?error:' diag.txt || true) erros"
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s#^$GITHUB_WORKSPACE/##"); ln=$(echo "$line" | cut -d: -f2)
            kind=$(echo "$line" | cut -d: -f4 | sed 's/fatal //' | tr -d ' '); msg=$(echo "$line" | cut -d: -f5-)
            echo "::${kind} file=${file},line=${ln}::${msg}"
          done < diag.txt
          # linker, CMake and make errors have no file:line prefix
          grep -E "undefined reference|multiple definition|ld returned|CMake Error|No rule to make|Error [0-9]+" build.log \
            | grep -v "^/.*: warning:" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=Build::${line}"
          done

      - name: Testes
        run: |
          cmake --build build --target openhantek_tests -j"$(nproc)"
          set -o pipefail
          cd build/openhantek && ctest --output-on-failure | tee ctest.log
          echo "::notice title=Testes::$(grep -E 'tests passed|testes' ctest.log | tail -1)"
          for t in psg9080protocol bodeanalysis arbwave psg9080presets; do echo "::notice title=$t::$(./test_$t | tr '\n' ' ')"; done

      - name: Pacote .deb
        run: |
          set -o pipefail
          cd build
          cpack -G DEB 2>&1 | tail -20
          deb=$(ls "$PWD"/packages/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          # the package must install on a clean Ubuntu 22.04 (same base as Pop!_OS) and find all its libraries
          sudo apt-get install -y "$deb"
          for b in OpenHantek PSG9080 OpenHantekBode; do
            if ldd "/usr/bin/$b" | grep "not found"; then echo "::error title=Pacote::$b sem bibliotecas"; exit 1; fi
          done
          desktop-file-validate /usr/share/applications/{openhantek,psg9080,openhantek-bode}.desktop 2>&1 | head -20 || true
          echo "::notice title=Pacote::$(basename "$deb") ($(du -h "$deb" | cut -f1)) depende de: $(dpkg-deb -f "$deb" Depends)"
          echo "DEB=$deb" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: pacote-deb
          path: build/packages/*.deb

      - name: Publicar na página de versões (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one rolling pre-release "continuo", always with the package of the newest main
          git tag -f continuo && git push -f origin refs/tags/continuo
          notes="Pacote para Pop!_OS / Ubuntu 22.04 ou mais novo (amd64), gerado do commit ${GITHUB_SHA::7}.

          Instalar (o apt baixa o Qt 6 sozinho):

              sudo apt install ./$(basename "$DEB")

          Depois de instalar, OpenHantek, PSG9080 e OpenHantek Bode aparecem no menu de aplicativos. A regra do udev já dá acesso ao osciloscópio sem sudo; para o gerador, o usuário precisa estar no grupo dialout (sudo usermod -aG dialout \$USER e entrar de novo na sessão)."
          gh release view continuo > /dev/null 2>&1 || gh release create continuo --prerelease --title "Versão contínua" --notes "$notes"
          gh release edit continuo --prerelease --title "Versão contínua (${GITHUB_SHA::7})" --notes "$notes"
          for a in $(gh release view continuo --json assets --jq '.assets[].name'); do gh release delete-asset continuo "$a" -y; done
          gh release upload continuo "$DEB"

      - name: Capturas das janelas
        if: always()
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core > /dev/null
          cd build/openhantek
          QT_QPA_PLATFORM=offscreen ./ui_snapshots "$GITHUB_WORKSPACE/shots" 2> ui.log || true
          sort -u ui.log | head -20 | while IFS= read -r line; do echo "::notice title=ui::${line}"; done
          # publish the images on the ci-shots branch (one commit, replaced every run)
          cd "$GITHUB_WORKSPACE/shots"
          git init -q && git checkout -q -b ci-shots
          git -c user.name=ci -c user.email=ci@localhost add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
