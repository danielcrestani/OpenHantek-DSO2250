name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-qt6:
    # Same base as Pop!_OS 22.04: Qt 6.2, GCC 11, libusb 1.0.25
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools libqt6opengl6-dev libqt6serialport6-dev libfftw3-dev \
            binutils-dev libusb-1.0-0-dev mesa-common-dev libgl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev

      - name: Configurar
        run: cmake -S . -B build -DOPENHANTEK_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 2>&1 | tee build.log

      - name: Avisos do compilador
        if: always()
        run: |
          # each GCC warning/error becomes an annotation (visible in the run summary and through the API)
          grep -E "^/.+:[0-9]+:[0-9]+: (warning|error|fatal error):" build.log | sort -u > diag.txt || true
          echo "::notice title=Compilação::$(grep -c ': warning:' diag.txt || true) avisos, $(grep -c -E ': (fatal )?error:' diag.txt || true) erros"
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s#^$GITHUB_WORKSPACE/##"); ln=$(echo "$line" | cut -d: -f2)
            kind=$(echo "$line" | cut -d: -f4 | sed 's/fatal //' | tr -d ' '); msg=$(echo "$line" | cut -d: -f5-)
            echo "::${kind} file=${file},line=${ln}::${msg}"
          done < diag.txt
          # linker, CMake and make errors have no file:line prefix
          grep -E "undefined reference|multiple definition|ld returned|CMake Error|No rule to make|Error [0-9]+" build.log \
            | grep -v "^/.*: warning:" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=Build::${line}"
          done

      - name: Testes
        run: |
          cmake --build build --target openhantek_tests -j"$(nproc)"
          set -o pipefail
          cd build/openhantek && ctest --output-on-failure | tee ctest.log
          echo "::notice title=Testes::$(grep -E 'tests passed|testes' ctest.log | tail -1)"
          for t in psg9080protocol bodeanalysis psg9080presets; do echo "::notice title=$t::$(./test_$t | tr '\n' ' ')"; done

      - name: Capturas das janelas
        if: always()
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core > /dev/null
          cd build/openhantek
          QT_QPA_PLATFORM=offscreen ./ui_snapshots shots
          # each image goes out as base64 in numbered notices (read back through the API)
          for f in shots/*.jpg; do
            n=$(basename "$f" .jpg); i=0
            base64 -w0 "$f" | fold -w 60000 | while IFS= read -r part; do
              echo "::notice title=shot-$n-$i::$part"; i=$((i+1))
            done
          done
